server:
  port: 9003

spring:
  application:
    name: geotrack-content-service
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/geotrack?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379

rocketmq:
  name-server: 127.0.0.1:9876

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

geotrack:
  guard:
    like:
      qps: 80
      user-window-seconds: 10
      user-max-requests: 20
      token-ttl-seconds: 60
